  var needs_validate = function(el) {
    if (el.getAttribute('required') !== null) return true;
    if ((el.name === 'email' || el.id === 'phone') && el.value !== "") return true;
    return false;
  };

  var validate_form = function(e) {
    var no_error = true;
    if (!submitted) {
      submitted = true;
      for (var i = 0; i < allInputs.length; i++) {
        var input = allInputs[i];
        if (needs_validate(input)) {
          if (input.type === 'text' || input.type === 'tel') {
            addEvent(input, 'blur', function() {
              this.value = this.value.trim();
              validate_field(this, true);
            });
            addEvent(input, 'input', function() {
              validate_field(this, true);
            });
          }
        }
      }
    }
    remove_tooltips();
    for (var i = 0; i < allInputs.length; i++) {
      var elem = allInputs[i];
      if (needs_validate(elem)) {
        if (elem.tagName.toLowerCase() !== "select") {
          elem.value = elem.value.trim();
        }
        validate_field(elem) ? true : no_error = false;
      }
    }
    if (!no_error && e) e.preventDefault();
    return no_error;
  };

  var _form_serialize = function(form) {
    if (!form || form.nodeName !== "FORM") return "";
    var q = [];
    for (var i = 0; i < form.elements.length; i++) {
      var el = form.elements[i];
      if (el.name === "") continue;
      switch (el.type) {
        case 'tel':
          if (typeof iti !== 'undefined') {
            q.push(el.name + "=" + encodeURIComponent(iti.getNumber()));
          } else {
            q.push(el.name + "=" + encodeURIComponent(el.value));
          }
          break;
        case 'text': case 'hidden': case 'password': case 'submit':
          q.push(el.name + "=" + encodeURIComponent(el.value));
          break;
        case 'checkbox': case 'radio':
          if (el.checked) q.push(el.name + "=" + encodeURIComponent(el.value));
          break;
      }
      if (el.tagName === 'TEXTAREA') q.push(el.name + "=" + encodeURIComponent(el.value));
      if (el.tagName === 'SELECT') q.push(el.name + "=" + encodeURIComponent(el.value));
    }
    return q.join("&");
  };

  var initializePhoneInput = function(inputPhone) {
    var style = document.createElement('link');
    style.rel = 'stylesheet';
    style.href = 'https://cdn.jsdelivr.net/npm/intl-tel-input@25.2.0/build/css/intlTelInput.css';
    document.head.appendChild(style);

    window._load_script('https://cdn.jsdelivr.net/npm/intl-tel-input@25.2.0/build/js/intlTelInput.min.js', function() {
      inputPhone.setAttribute("name", "phone-iti");
      iti = intlTelInput(inputPhone, {
        loadUtils: function() { return import('https://cdn.jsdelivr.net/npm/intl-tel-input@25.2.0/build/js/utils.js'); },
        hiddenInput: function() { return { phone: 'phone' }; },
        separateDialCode: true,
        autoPlaceholder: 'aggressive',
        initialCountry: 'auto',
        geoIpLookup: function(success) {
          fetch('https://residentelitemarketing.activehosted.com/api/public/geo.php')
            .then(function(res) { return res.json(); })
            .then(function(data) { success(data.country_code || 'BR'); })
            .catch(function() { success('BR'); });
        }
      });
    }, false);
  };

  var inputPhone = form_to_submit.querySelector("#phone");
  if (inputPhone) initializePhoneInput(inputPhone);

  var form_submit = function(e) {
    e.preventDefault();
    if (validate_form()) {
      if (form_to_submit.querySelector('input[name="phone"]') && typeof iti !== 'undefined') {
        form_to_submit.querySelector('input[name="phone"]').value = iti.getNumber();
      }
      var submitButton = e.target.querySelector('#_form_7_submit');
      submitButton.disabled = true;
      submitButton.classList.add('processing');
      var serialized = _form_serialize(document.getElementById('_form_7_')).replace(/%0A/g, '\\n');
      window._load_script('https://residentelitemarketing.activehosted.com/proc.php?' + serialized + '&jsonp=true', null, true);
    }
    return false;
  };

  addEvent(form_to_submit, 'submit', form_submit);
})();
</script>
</body>
</html>
